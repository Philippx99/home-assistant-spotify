name: Spotify Browser
version: "1.0.0"
slug: spotify_browser
description: Spotify im Home-Assistant-Menü öffnen und Browser-Audio an einen Media Player streamen.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Live-Audiostream für Media Player im lokalen Netzwerk
panel_icon: mdi:spotify
panel_title: Spotify
options:
  stream_base_url: ""
schema:
  stream_base_url: str?

